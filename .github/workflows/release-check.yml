# Proves that a release tag installs: in an empty Vite project and in a Laravel-shaped one (resources/js, rsc: false),
# `shadcn add RahulSulegaokar/vellum/dialog#<tag> --dry-run` must resolve dialog, its button dependency and the theme
# from that tag. Runs when a v* tag is pushed, and by hand for any tag.
name: Release check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layout: [vite, laravel]
    env:
      SHADCN_CLI: shadcn@4.23.0
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make an empty ${{ matrix.layout }} project
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund tailwindcss@4 react@19 react-dom@19 > /dev/null
          if [ "${{ matrix.layout }}" = "laravel" ]; then base=resources/js; css=resources/css/app.css; else base=src; css=src/index.css; fi
          mkdir -p "$(dirname "$css")" "$base/lib"
          echo '@import "tailwindcss";' > "$css"
          printf 'export function cn(...c: string[]) { return c.filter(Boolean).join(" ") }\n' > "$base/lib/utils.ts"
          printf '{ "compilerOptions": { "baseUrl": ".", "paths": { "@/*": ["./%s/*"] } } }\n' "$base" > tsconfig.json
          cat > components.json <<JSON
          { "\$schema": "https://ui.shadcn.com/schema.json", "style": "new-york", "rsc": false, "tsx": true,
            "tailwind": { "config": "", "css": "$css", "baseColor": "neutral", "cssVariables": true, "prefix": "" },
            "aliases": { "components": "@/components", "utils": "@/lib/utils", "ui": "@/components/ui", "lib": "@/lib", "hooks": "@/hooks" } }
          JSON
      - name: Dry-run install from the tag
        working-directory: app
        run: |
          npx "$SHADCN_CLI" add "RahulSulegaokar/vellum/dialog#$TAG" --dry-run --yes 2>&1 | tee ../dry-run.txt
          for item in dialog button vellum-theme; do
            grep -q "$item" ../dry-run.txt || { echo "$item did not resolve from $TAG"; exit 1; }
          done
