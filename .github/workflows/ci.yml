name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Registry is in sync with the source files
        run: npm run registry:generate && git diff --exit-code registry.json app/theme.css
      - run: npm run registry:validate
      - name: Text contrast meets WCAG AA (light and dark)
        run: npm run test:contrast
      - run: npm run registry:build
      - run: npm run typecheck
      - run: npm run lint
      - name: Every built-in string is translatable
        run: npm run test:strings
      - name: Every item type-checks in a strict Vite-style project
        run: npm run test:install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Screenshots are compared on macOS (the committed baselines); CI checks everything else against the
      # production build: console errors on every gallery page and the whole accessibility spec.
      - name: Gallery and accessibility tests (production build)
        run: npx playwright test --ignore-snapshots
